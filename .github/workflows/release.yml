name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
            ext: .exe
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Test
        run: |
          go test ./...
          go test -tags desktop ./...
          go vet ./...
          go vet -tags desktop ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -tags desktop -trimpath -ldflags "-s -w" -o "dist/bt-go-desktop-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" .

      - name: Package
        shell: bash
        run: |
          cd dist
          artifact="bt-go-desktop-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${artifact}.zip" "${artifact}.exe"
          else
            zip "${artifact}.zip" "${artifact}"
          fi
          shasum -a 256 "${artifact}.zip" > "${artifact}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bt-go-desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
