name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Test
        run: |
          go test -run '^$' ./...
          go test -run '^$' -tags desktop ./...
          go vet ./...
          go vet -tags desktop ./...

  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
            ext: .exe
            cgo: "0"
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            ext: ""
            cgo: "1"
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: ""
            cgo: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p dist
          go build -tags desktop -trimpath -ldflags "-s -w" -o "dist/bt-go-desktop-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/bt-go

      - name: Package
        shell: bash
        run: |
          cd dist
          artifact="bt-go-desktop-${{ matrix.goos }}-${{ matrix.goarch }}"
          chmod +x "${artifact}${{ matrix.ext }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${artifact}.zip" "${artifact}.exe"
          else
            zip "${artifact}.zip" "${artifact}"
          fi
          shasum -a 256 "${artifact}${{ matrix.ext }}" > "${artifact}${{ matrix.ext }}.sha256"
          shasum -a 256 "${artifact}.zip" > "${artifact}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bt-go-desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/bt-go-desktop-*
            dist/*.zip
            dist/*.sha256

  build-android:
    name: build android debug apk
    needs: test
    runs-on: ubuntu-latest
    env:
      BT_GO_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK pieces
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install gomobile tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260520154334-0e4426e1883d
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260520154334-0e4426e1883d
          gomobile init

      - name: Build APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          ./build-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bt-go-android-debug
          path: |
            dist/bt-go-android-debug.apk
            dist/bt-go-android-debug.apk.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
